services:
  db:
    image: pgvector/pgvector:pg16
    container_name: omnimission-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni
      POSTGRES_DB: omnimission
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omnimission"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: omnimission-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://omni:omni@db:5432/omnimission
      CORS_ORIGINS: http://localhost:3000
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/.data/uploads
      TOOLBOX_URL: http://toolbox:5000
    volumes:
      - api_uploads:/app/.data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3

  toolbox:
    image: ghcr.io/googleapis/genai-toolbox:latest
    container_name: omnimission-toolbox
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./infra/toolbox/tools.yaml:/tools.yaml:ro
    command: ["--tools-file", "/tools.yaml", "--port", "5000"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: omnimission
      DB_USER: toolbox_ro
      DB_PASSWORD: toolbox_ro_secret

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: omnimission-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  caddy:
    image: caddy:2-alpine
    container_name: omnimission-caddy
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "8443:8443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  api_uploads:
  caddy_data:
  caddy_config:
